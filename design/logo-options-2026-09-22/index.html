<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Javier Vallejo — Logo options</title>
    <link rel="icon" type="image/svg+xml" href="02-cut-favicon.svg" />
    <style>
      @font-face {
        font-family: Geist;
        src: url('../../node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2')
          format('woff2');
        font-weight: 100 900;
        font-display: swap;
      }
      :root {
        font-family: Geist, sans-serif;
        color: #f7f9fc;
        background: #06080d;
        font-synthesis: none;
        -webkit-font-smoothing: antialiased;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      button,
      a {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      a {
        color: inherit;
        text-underline-offset: 4px;
      }
      button:focus-visible,
      a:focus-visible {
        outline: 2px solid #58adff;
        outline-offset: 5px;
      }
      main {
        max-width: 1400px;
        padding: 46px 48px 36px;
        margin: auto;
      }
      .intro {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 24px;
        margin-bottom: 38px;
      }
      .intro p {
        margin: 0 0 12px;
        color: #a8b3c5;
        font-size: 14px;
      }
      h1 {
        font-size: clamp(30px, 4vw, 46px);
        line-height: 1.1;
        font-weight: 550;
        letter-spacing: -0.045em;
        margin: 0;
      }
      .controls {
        display: flex;
        gap: 4px;
        border: 1px solid #344052;
        padding: 4px;
        border-radius: 8px;
        flex-shrink: 0;
      }
      .controls button {
        padding: 8px 14px;
        color: #a8b3c5;
        background: transparent;
        border: 0;
        border-radius: 4px;
        font-size: 13px;
      }
      .controls button[aria-pressed='true'] {
        background: #243247;
        color: #fff;
      }
      .options {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        border-top: 1px solid #283140;
        border-bottom: 1px solid #283140;
      }
      article {
        min-width: 0;
        padding: 25px 26px 26px;
      }
      article:first-child {
        padding-left: 0;
      }
      article:last-child {
        padding-right: 0;
      }
      article + article {
        border-left: 1px solid #283140;
      }
      .option-heading {
        display: flex;
        gap: 12px;
        align-items: baseline;
        margin-bottom: 8px;
      }
      .number {
        font-size: 14px;
        color: #8492a8;
        font-variant-numeric: tabular-nums;
      }
      h2 {
        font-size: 23px;
        font-weight: 550;
        letter-spacing: -0.025em;
        margin: 0;
      }
      .description {
        font-size: 13px;
        color: #a8b3c5;
        line-height: 1.6;
        min-height: 42px;
        margin: 0;
        max-width: 290px;
      }
      .hero-mark {
        height: 212px;
        display: grid;
        place-items: center;
        color: #f7f9fc;
      }
      .hero-mark svg {
        width: 156px;
        height: 156px;
      }
      .lockup {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        height: 60px;
        color: #58adff;
        margin-bottom: 28px;
      }
      .lockup svg {
        height: 40px;
        width: 40px;
      }
      .lockup span {
        color: #f7f9fc;
        font-size: 22px;
        font-weight: 550;
        letter-spacing: -0.035em;
        white-space: nowrap;
      }
      .paper {
        background: #f3f4f6;
        color: #0768c9;
        padding: 24px 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 11px;
        min-height: 87px;
      }
      .paper svg {
        width: 36px;
        height: 36px;
      }
      .paper span {
        color: #101724;
        font-size: 20px;
        font-weight: 550;
        letter-spacing: -0.035em;
        white-space: nowrap;
      }
      .small-label {
        font-size: 11px;
        color: #8492a8;
        margin: 24px 0 12px;
      }
      .tab {
        display: flex;
        align-items: center;
        gap: 10px;
        height: 40px;
        background: #1c2330;
        border-radius: 9px 9px 0 0;
        padding: 0 13px;
        font-size: 12px;
        color: #d6deea;
      }
      .tab img {
        width: 16px;
        height: 16px;
      }
      .tab .cross {
        margin-left: auto;
        font-size: 17px;
        font-weight: 300;
        color: #8492a8;
      }
      .browser-line {
        height: 6px;
        background: #252e3c;
      }
      .favicon-row {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-top: 18px;
      }
      .favicon-sample {
        display: flex;
        gap: 12px;
        align-items: center;
        justify-content: center;
        min-width: 94px;
        height: 52px;
        background: #0d1119;
      }
      .favicon-sample.light {
        background: #f3f4f6;
      }
      .favicon-sample img {
        flex-shrink: 0;
      }
      .sizes {
        color: #8492a8;
        font-size: 11px;
      }
      .asset-links {
        display: flex;
        gap: 20px;
        font-size: 12px;
        margin-top: 23px;
        color: #a8b3c5;
      }
      .context {
        padding-top: 27px;
      }
      .context-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 18px;
      }
      .context-top p {
        margin: 0;
        color: #a8b3c5;
        font-size: 13px;
      }
      .context .controls button {
        padding: 6px 12px;
      }
      .site-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 30px;
        border-top: 1px solid #283140;
        border-bottom: 1px solid #283140;
        padding: 16px 0;
      }
      .site-brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: #58adff;
      }
      .site-brand svg {
        width: 34px;
        height: 34px;
      }
      .site-brand span {
        color: #f7f9fc;
        font-size: 15px;
        font-weight: 550;
        letter-spacing: -0.025em;
      }
      .nav {
        display: flex;
        gap: 25px;
        font-size: 12px;
        color: #a8b3c5;
      }
      .footer {
        margin: 18px 0 0;
        font-size: 11px;
        color: #8492a8;
      }
      body.mono .lockup,
      body.mono .site-brand {
        color: #f7f9fc;
      }
      body.mono .paper {
        color: #101724;
      }
      @media (max-width: 1000px) {
        main {
          padding: 32px 28px;
        }
        article {
          padding-inline: 18px;
        }
        .lockup {
          gap: 7px;
        }
        .lockup span {
          font-size: 19px;
        }
        .paper span {
          font-size: 18px;
        }
        .favicon-row {
          gap: 8px;
        }
        .favicon-sample {
          min-width: 80px;
        }
        .sizes {
          font-size: 10px;
        }
      }
      @media (max-width: 740px) {
        .intro {
          align-items: start;
          flex-direction: column;
          margin-bottom: 25px;
        }
        .options {
          grid-template-columns: 1fr;
        }
        article,
        article:first-child,
        article:last-child {
          padding: 24px 0;
        }
        article + article {
          border-left: 0;
          border-top: 1px solid #283140;
        }
        .hero-mark {
          height: 190px;
        }
        .description {
          min-height: 0;
          max-width: none;
        }
        .paper {
          padding-block: 16px;
        }
        .lockup {
          margin-bottom: 15px;
        }
        .favicon-row {
          gap: 14px;
        }
        .favicon-sample {
          min-width: 100px;
        }
        .nav {
          display: none;
        }
        .context-top {
          align-items: start;
          flex-direction: column;
        }
      }
      @media (prefers-reduced-motion: no-preference) {
        .lockup,
        .paper,
        .site-brand {
          transition: color 160ms ease;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header class="intro">
        <div>
          <p>Javier Vallejo · Identity exploration</p>
          <h1>Logo & favicon options</h1>
        </div>
        <div class="controls" role="group" aria-label="Logo colour">
          <button type="button" data-color="blue" aria-pressed="true">
            Portfolio blue</button
          ><button type="button" data-color="mono" aria-pressed="false">
            Monochrome
          </button>
        </div>
      </header>
      <section class="options" aria-label="Three logo concepts"></section>
      <section class="context" aria-label="Preview in the portfolio header">
        <div class="context-top">
          <p>Try each mark in your portfolio header</p>
          <div class="controls" role="group" aria-label="Header logo option">
            <button type="button" data-option="0" aria-pressed="true">
              1 · Connected</button
            ><button type="button" data-option="1" aria-pressed="false">
              2 · Cut</button
            ><button type="button" data-option="2" aria-pressed="false">
              3 · Lowercase
            </button>
          </div>
        </div>
        <div class="site-header">
          <div class="site-brand" aria-live="polite"></div>
          <div class="nav" aria-hidden="true">
            <span>Work</span><span>Experience</span><span>About</span
            ><span>Contact</span><span>Download CV ↗</span>
          </div>
        </div>
        <p class="footer">
          Original SVG paths. Favicons shown at actual 16 px and 32 px sizes.
          Option 2, Cut, was selected for the portfolio.
        </p>
      </section>
    </main>
    <script>
      const concepts = [
        {
          name: 'Connected',
          file: '01-connected',
          description:
            'One continuous JV stroke. Personal, light and a little unconventional.',
          viewBox: '0 0 72 72',
          paths:
            '<path d="M9 44c0 14 22 14 22-1V14l17 41 17-41" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>',
        },
        {
          name: 'Cut',
          file: '02-cut',
          description:
            'A compact, solid JV ligature. Strong geometry with a shared top edge.',
          viewBox: '0 0 80 80',
          paths:
            '<path d="M10 10h27l13 36 13-36h13L56 64H44L30 25v18c0 14-7 21-20 21H4V51h6c5 0 7-3 7-8V23h-7Z" fill="currentColor"/>',
        },
        {
          name: 'Lowercase',
          file: '03-lowercase',
          description:
            'A rounded j beside a crisp v. Friendly, readable and understated.',
          viewBox: '0 0 72 72',
          paths:
            '<circle cx="18" cy="12" r="5" fill="currentColor"/><path d="M13 26h10v22c0 12-6 18-17 18V56c5 0 7-3 7-8Zm17 0h11l8 23 8-23h11L56 58H42Z" fill="currentColor"/>',
        },
      ];
      const mark = (concept) =>
        `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${concept.viewBox}" aria-hidden="true">${concept.paths}</svg>`;
      document.querySelector('.options').innerHTML = concepts
        .map(
          (concept, index) => `<article>
        <div class="option-heading"><span class="number">0${index + 1}</span><h2>${concept.name}</h2></div>
        <p class="description">${concept.description}</p>
        <div class="hero-mark">${mark(concept)}</div>
        <div class="lockup">${mark(concept)}<span>Javier Vallejo</span></div>
        <div class="paper">${mark(concept)}<span>Javier Vallejo</span></div>
        <p class="small-label">In a browser tab</p>
        <div class="tab"><img src="${concept.file}-favicon.svg" alt="${concept.name} favicon"/><span>Javier Vallejo</span><span class="cross" aria-hidden="true">×</span></div><div class="browser-line"></div>
        <div class="favicon-row"><div class="favicon-sample"><img src="${concept.file}-favicon.svg" width="16" height="16" alt="16 pixel favicon on dark"/><img src="${concept.file}-favicon.svg" width="32" height="32" alt="32 pixel favicon on dark"/></div><div class="favicon-sample light"><img src="${concept.file}-favicon.svg" width="16" height="16" alt="16 pixel favicon on light"/><img src="${concept.file}-favicon.svg" width="32" height="32" alt="32 pixel favicon on light"/></div><span class="sizes">16 / 32 px</span></div>
        <div class="asset-links"><a href="${concept.file}.svg" download>Logo SVG ↓</a><a href="${concept.file}-favicon.svg" download>Favicon SVG ↓</a></div>
      </article>`,
        )
        .join('');
      const updateHeader = (index) => {
        document.querySelector('.site-brand').innerHTML =
          `${mark(concepts[index])}<span>Javier Vallejo</span>`;
        document
          .querySelectorAll('[data-option]')
          .forEach((button) =>
            button.setAttribute(
              'aria-pressed',
              String(Number(button.dataset.option) === index),
            ),
          );
      };
      document
        .querySelectorAll('[data-option]')
        .forEach((button) =>
          button.addEventListener('click', () =>
            updateHeader(Number(button.dataset.option)),
          ),
        );
      document.querySelectorAll('[data-color]').forEach((button) =>
        button.addEventListener('click', () => {
          document.body.classList.toggle(
            'mono',
            button.dataset.color === 'mono',
          );
          document
            .querySelectorAll('[data-color]')
            .forEach((item) =>
              item.setAttribute('aria-pressed', String(item === button)),
            );
        }),
      );
      updateHeader(1);
    </script>
  </body>
</html>
