<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>OG image</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        display: flex;
        width: 1200px;
        height: 630px;
        align-items: center;
        gap: 72px;
        padding: 80px;
        color: #e8e8e8;
        background: #111111;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        flex: 1;
      }
      .mark {
        width: 44px;
        height: 44px;
        margin-bottom: 48px;
      }
      h1 {
        font-size: 44px;
        font-weight: 600;
      }
      .role {
        margin-top: 6px;
        color: #9b9b9b;
        font-size: 30px;
      }
      p.line {
        margin-top: 40px;
        font-size: 34px;
        line-height: 1.4;
      }
      .url {
        margin-top: 48px;
        color: #9b9b9b;
        font-size: 26px;
      }
      .photo {
        width: 300px;
        height: 375px;
        object-fit: cover;
        object-position: center top;
        border-radius: 10px;
      }
    </style>
  </head>
  <body>
    <main>
      <img class="mark" src="../../public/logo.svg" alt="" />
      <h1>Javier Vallejo</h1>
      <p class="role">Full-stack developer, Gibraltar</p>
      <p class="line">
        I work on the game catalogue behind the Hard Rock Bet Mexico casino.
      </p>
      <p class="url">jvallejo.dev</p>
    </main>
    <img class="photo" src="../../public/img/pfp.jpg" alt="" />
  </body>
</html>
