<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>OG image</title>
    <style>
      @font-face {
        font-family: 'Fraunces';
        src: url('../../node_modules/@fontsource-variable/fraunces/files/fraunces-latin-soft-normal.woff2')
          format('woff2');
        font-weight: 100 900;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        display: flex;
        width: 1200px;
        height: 630px;
        align-items: center;
        justify-content: space-between;
        padding: 0 90px;
        color: #f3ead8;
        background: #17130f;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      h1 {
        max-width: 640px;
        font-family: 'Fraunces', Georgia, serif;
        font-size: 58px;
        font-weight: 360;
        line-height: 1.08;
        letter-spacing: -0.02em;
        font-variation-settings: 'SOFT' 100;
      }
      h1 strong {
        font-weight: 680;
      }
      p {
        margin-top: 28px;
        color: #b5a893;
        font-size: 26px;
      }
      .tiles {
        display: grid;
        grid-template-columns: repeat(3, 96px);
        gap: 14px;
        transform: rotate(-6deg);
      }
      .tile {
        display: grid;
        width: 96px;
        height: 96px;
        place-items: center;
        color: #17130f;
        border-radius: 24%;
        font-family: 'Fraunces', Georgia, serif;
        font-size: 40px;
        font-weight: 650;
        font-variation-settings: 'SOFT' 100;
      }
      .eyes {
        display: flex;
        gap: 6px;
      }
      .eye {
        position: relative;
        width: 23px;
        height: 23px;
        background: #fff;
        border-radius: 50%;
      }
      .eye::after {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 45%;
        height: 45%;
        content: '';
        background: #17130f;
        border-radius: 50%;
        transform: translate(-5%, -50%);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>
        <strong>Javier Vallejo</strong> builds the casino game catalogue for
        Hard Rock Bet Mexico.
      </h1>
      <p>Full-stack developer, Gibraltar · jvallejo.dev</p>
    </main>
    <div class="tiles">
      <span class="tile" style="background: #6aa9ff">7</span>
      <span class="tile" style="color: #f3ead8; border: 3px solid rgba(243, 234, 216, 0.3)">♠</span>
      <span class="tile" style="background: #f2b84b">A</span>
      <span class="tile" style="background: #4cc2b0">♥</span>
      <span class="tile" style="background: #ff7a5c"
        ><span class="eyes"><span class="eye"></span><span class="eye"></span></span
      ></span>
      <span class="tile" style="background: #ff9eb1">★</span>
      <span class="tile" style="color: #f3ead8; border: 3px solid rgba(243, 234, 216, 0.3)">K</span>
      <span class="tile" style="background: #a597ff">♦</span>
      <span class="tile" style="background: #f3ead8">3</span>
    </div>
  </body>
</html>
